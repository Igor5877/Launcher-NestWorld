plugins {
    id 'java'
}

group = 'pro.gravit.launchserver.modules.accessexport'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    compileOnly project(':LaunchServer')
    compileOnly project(':LauncherAPI')
    compileOnly project(':LauncherCore')
    compileOnly group: 'com.google.code.gson', name: 'gson', version: rootProject['verGson']
    compileOnly group: 'org.apache.logging.log4j', name: 'log4j-api', version: rootProject['verLog4j']

    testImplementation project(':LaunchServer')
    testImplementation project(':LauncherAPI')
    testImplementation project(':LauncherCore')
    testImplementation group: 'com.google.code.gson', name: 'gson', version: rootProject['verGson']
    testImplementation group: 'org.apache.logging.log4j', name: 'log4j-api', version: rootProject['verLog4j']
    testImplementation group: 'com.h2database', name: 'h2', version: rootProject['verH2Conn']
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter', version: rootProject['verJunit']
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes(
                'Module-Main-Class': 'pro.gravit.launchserver.modules.accessexport.AccessExportModule',
                'Automatic-Module-Name': 'pro.gravit.launchserver.modules.accessexport'
        )
    }
}
