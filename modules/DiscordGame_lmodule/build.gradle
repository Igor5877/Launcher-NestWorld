plugins {
    id 'java'
}

group = 'pro.gravit.launchermodules'
version = '1.1.0.1'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url 'https://maven.gravitlauncher.com/' }
}

dependencies {
    compileOnly project(':Launcher')
    compileOnly project(':LauncherCore')
    compileOnly project(':LauncherAPI')
    compileOnly project(':LauncherClient')

    // discord-game-sdk4j — тільки для компіляції.
    // Готовий JAR потрібно завантажити вручну і покласти в /LaunchServer/launcher-libraries/
    // Завантажити: https://jitpack.io/com/github/JnCrMx/discord-game-sdk4j/v1.0.0/discord-game-sdk4j-v1.0.0.jar
    // УВАГА: v1.0.0 більше НЕ потребує нативних бібліотек — спілкується з Discord через IPC.
    compileOnly('com.github.JnCrMx:discord-game-sdk4j:v1.0.0') {
        exclude group: 'com.google.code.gson', module: 'gson'
    }
}

jar {
    manifest {
        attributes(
            'Module-Main-Class': 'pro.gravit.launchermodules.discordgame.ClientModule',
            'Module-Config-Class': 'pro.gravit.launchermodules.discordgame.Config',
            'Module-Config-Name': 'DiscordGame'
        )
    }
    // НЕ fat-JAR: discord-game-sdk4j кладеться окремо в launcher-libraries/
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
